[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odin-eye"
version = "1.0.0"
description = "The All-Seeing Ethical AI Crawler & Autonomous Full-Stack Reverse-Engineering Engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Nikhil Alakri", email = "nikhilalakri101@gmail.com"}
]
keywords = [
    "odin-eye",
    "web-crawler",
    "reverse-engineering",
    "system-architecture",
    "multimodal-ai",
    "robots-txt",
    "sitemap",
    "chromadb",
    "rag",
    "nvidia-nim",
    "fastapi",
    "playwright"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.1",
    "html2text>=2024.2.26",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "openai>=1.30.0",
    "defusedxml>=0.7.1",
    "reportlab>=4.0.0",
    "chromadb>=0.5.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.44.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.4.4",
]
all = [
    "ethical-crawler[browser,dev]",
]

[project.scripts]
crawler = "ethical_crawler.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

